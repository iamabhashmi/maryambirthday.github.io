<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Maryam!</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            color: #333;
            text-align: center;
            overflow: hidden;
        }
        .container {
            position: relative;
            padding: 30px;
            max-width: 700px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            animation: fadeInSlide 2s ease-in-out;
        }
        h1 {
            font-size: 3.5rem;
            color: #ff6f61;
            margin: 0;
            animation: fadeIn 2s ease-in-out;
        }
        p {
            font-size: 1.5rem;
            margin: 20px 0;
            color: #555;
            animation: fadeIn 2.5s ease-in-out;
        }
        .balloons img {
            width: 80px;
            margin: 10px;
            animation: float 3s ease-in-out infinite;
        }
        .balloons img:nth-child(2) {
            animation-delay: 0.5s;
        }
        .balloons img:nth-child(3) {
            animation-delay: 1s;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-30px);
            }
        }
        @keyframes fadeInSlide {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        .footer {
            margin-top: 20px;
            font-size: 1rem;
            color: #666;
            animation: fadeIn 3s ease-in-out;
        }
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <h1>Happy Birthday Maryam! 🎉</h1>
        <p>May your special day be filled with joy, laughter, and unforgettable moments. Here's to a fantastic year ahead! 🥳</p>
        <div class="balloons">
            <img src="blackballoon.png" alt="Balloon">
            <img src="purpleballoon.png" alt="Balloon">
            <img src="yellowballoon.png" alt="Balloon">

        </div>
        <div class="footer">🎂 Celebrate and enjoy your day to the fullest! 🎂</div>
<div class="signature">From AB Hashmi</div>
    </div>
</body>
</html>
